name: Use the packer bundle
description: >
  Downloads the "appflare-packer" artifact from build-packer into ./appflare,
  sets APPFLARE_DIR, sets up pnpm and Node, and installs the catalog's own
  dependencies. Needs no secrets. Expects the catalog checked out at ./catalog.
  The download is checked against the sha256 build-packer reported before
  anything in it is extracted or run.
inputs:
  sha256:
    description: The build-packer job's packer-sha256 output.
    required: true
runs:
  using: composite
  steps:
    - name: Download the packer bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: appflare-packer
        path: ${{ runner.temp }}/appflare-packer

    - name: Check the bundle's sha256 and unpack it to ./appflare
      shell: bash
      env:
        EXPECTED_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        bundle="${RUNNER_TEMP}/appflare-packer/appflare-packer.tgz"
        actual="$(sha256sum "${bundle}" | cut -d' ' -f1)"
        if ! [[ "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]] || [ "${actual}" != "${EXPECTED_SHA256}" ]; then
          echo "::error title=Packer bundle mismatch::appflare-packer.tgz has sha256 ${actual}, but build-packer produced ${EXPECTED_SHA256:-(nothing)}. Refusing to run it."
          exit 1
        fi
        mkdir -p "${GITHUB_WORKSPACE}/appflare"
        tar -xzf "${bundle}" -C "${GITHUB_WORKSPACE}/appflare"
        echo "APPFLARE_DIR=${GITHUB_WORKSPACE}/appflare" >> "${GITHUB_ENV}"

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: catalog/package.json

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: catalog/.node-version

    - name: Install catalog dependencies
      shell: bash
      working-directory: catalog
      run: pnpm install --frozen-lockfile
