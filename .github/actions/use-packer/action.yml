name: Use the packer bundle
description: >
  Downloads the "appflare-packer" artifact from build-packer into ./appflare,
  sets APPFLARE_DIR, sets up pnpm and Node, and installs the catalog's own
  dependencies. Needs no secrets. Expects the catalog checked out at ./catalog.
runs:
  using: composite
  steps:
    - name: Download the packer bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: appflare-packer
        path: ${{ runner.temp }}/appflare-packer

    - name: Unpack to ./appflare
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/appflare"
        tar -xzf "${RUNNER_TEMP}/appflare-packer/appflare-packer.tgz" -C "${GITHUB_WORKSPACE}/appflare"
        echo "APPFLARE_DIR=${GITHUB_WORKSPACE}/appflare" >> "${GITHUB_ENV}"

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: catalog/package.json

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: catalog/.node-version

    - name: Install catalog dependencies
      shell: bash
      working-directory: catalog
      run: pnpm install --frozen-lockfile
