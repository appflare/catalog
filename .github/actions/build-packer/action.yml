name: Build the packer bundle
description: >
  Checks out appflare/appflare at the SHA in .appflare-ref (over SSH with the
  read-only deploy key in the APPFLARE_DEPLOY_KEY secret when it is set, which
  a private appflare/appflare needs; anonymously over HTTPS otherwise, which a
  public one allows), builds it, and uploads a self-contained bundle of
  @appflare/pack and @appflare/schema (each with its production node_modules,
  made with `pnpm deploy`) as the workflow artifact "appflare-packer". No app
  code runs here. Expects the catalog checked out at ./catalog.
inputs:
  appflare-deploy-key:
    description: >
      Private half of the read-only deploy key registered on appflare/appflare
      (the APPFLARE_DEPLOY_KEY secret). Composite actions cannot read secrets,
      so each workflow passes it in. Empty: check out anonymously, which works
      only while appflare/appflare is public.
    required: false
    default: ""
outputs:
  sha256:
    description: >
      sha256 of the uploaded appflare-packer.tgz. Expose it as a job output: every
      job that downloads the bundle checks it first, so a later job (such as
      pack, which runs app code) cannot swap the bundle other jobs run.
    value: ${{ steps.bundle.outputs.sha256 }}
runs:
  using: composite
  steps:
    - name: Note an anonymous checkout
      shell: bash
      env:
        APPFLARE_DEPLOY_KEY: ${{ inputs.appflare-deploy-key }}
      run: |
        if [ -z "${APPFLARE_DEPLOY_KEY}" ]; then
          echo "::notice::APPFLARE_DEPLOY_KEY is not set; checking out appflare/appflare anonymously."
        fi

    - name: Read .appflare-ref
      id: ref
      shell: bash
      working-directory: catalog
      run: |
        sha="$(tr -d '[:space:]' < .appflare-ref)"
        if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error file=.appflare-ref::.appflare-ref must hold one 40-character commit SHA of appflare/appflare"
          exit 1
        fi
        echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

    - name: Check out appflare/appflare at the pinned SHA
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: appflare/appflare
        ref: ${{ steps.ref.outputs.sha }}
        ssh-key: ${{ inputs.appflare-deploy-key }}
        path: appflare-src
        persist-credentials: false

    - name: Explain a failed anonymous checkout
      if: failure() && steps.checkout.outcome == 'failure' && inputs.appflare-deploy-key == ''
      shell: bash
      run: |
        echo "::error title=APPFLARE_DEPLOY_KEY is not set::The catalog builds @appflare/pack from a pinned checkout of appflare/appflare, and could not check it out without a key. While appflare/appflare is private, add the private half of a read-only deploy key registered on it as the APPFLARE_DEPLOY_KEY secret of this repository (see CONTRIBUTING.md). Pull requests from forks do not receive secrets."
        exit 1

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: catalog/package.json

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: catalog/.node-version

    - name: Build and bundle @appflare/pack and @appflare/schema
      id: bundle
      shell: bash
      working-directory: appflare-src
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
        # Only the packer and what it depends on (schema, cf-api), not the manager.
        pnpm exec turbo run build --filter=@appflare/pack...
        out="${RUNNER_TEMP}/appflare-packer"
        rm -rf "${out}"
        # --legacy: pnpm 10's deploy otherwise requires inject-workspace-packages.
        pnpm --filter @appflare/pack deploy --prod --legacy "${out}/packages/pack"
        pnpm --filter @appflare/schema deploy --prod --legacy "${out}/packages/schema"
        # tar keeps node_modules' (relative) symlinks, which artifact upload would not.
        tar -C "${out}" -czf "${RUNNER_TEMP}/appflare-packer.tgz" packages
        sha="$(sha256sum "${RUNNER_TEMP}/appflare-packer.tgz" | cut -d' ' -f1)"
        echo "appflare-packer.tgz sha256 ${sha}"
        echo "sha256=${sha}" >> "${GITHUB_OUTPUT}"

    - name: Upload the packer bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: appflare-packer
        path: ${{ runner.temp }}/appflare-packer.tgz
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
