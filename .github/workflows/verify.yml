name: verify

# Pull requests: check the catalog tooling, then validate each changed app's
# manifest, pack it (unsigned), verify the artifact's hashes, and install the
# packed artifact into the CI Cloudflare account to check that it deploys and
# answers, deleting everything afterwards. No release.
#
# What runs depends on the entry's install.tier:
#   artifact        validate, pack, install check
#   sandbox         validate, pack (proves the pinned commit builds and fits
#                   the module limit); no install check: the user's account
#                   builds it, and verify-tier.yml checks it by hand
#   self-deploying  validate only (the check job validates every manifest)
#
# Secrets: build-packer gets APPFLARE_DEPLOY_KEY; install gets the CI account's
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in its deploy and cleanup steps
# only. pack, which runs the app's install and build, gets none. Fork pull
# requests get no secrets, so build-packer fails and install is skipped.
#
# Pull requests opened by the bump workflow (with the workflow token) do not
# trigger pull_request runs, so that workflow starts this one with
# workflow_dispatch on the bump branch; changed apps are then diffed against main.
#
# The last job, "verify passed", sums up the others under one fixed name, so a
# branch ruleset can require it however many apps a pull request touches.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: catalog

jobs:
  build-packer:
    name: build packer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      # Every job that downloads the bundle checks it against this.
      packer-sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          persist-credentials: false
      - id: build
        uses: ./catalog/.github/actions/build-packer
        with:
          appflare-deploy-key: ${{ secrets.APPFLARE_DEPLOY_KEY }}

  check:
    name: check (typecheck, lint, test, generated files)
    needs: build-packer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          persist-credentials: false
      - uses: ./catalog/.github/actions/use-packer
        with:
          sha256: ${{ needs.build-packer.outputs.packer-sha256 }}
      - run: pnpm check
      - run: pnpm validate
      - run: pnpm sync-schema --check
      - run: pnpm gen-codeowners --check

  changes:
    name: changed apps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Changed apps to pack (artifact and sandbox tiers) and to install (artifact tier).
      pack: ${{ steps.changed.outputs.pack }}
      install: ${{ steps.changed.outputs.install }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: catalog/.node-version
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          if [ -z "${base}" ]; then
            # workflow_dispatch: compare the branch with main.
            base="$(git rev-parse origin/main)"
          fi
          pack="$(node scripts/changed-apps.ts --base "${base}" --head "${HEAD_SHA}" --tiers artifact,sandbox)"
          install="$(node scripts/changed-apps.ts --base "${base}" --head "${HEAD_SHA}" --tiers artifact)"
          echo "changed apps to pack: ${pack}"
          echo "changed apps to install: ${install}"
          echo "pack=${pack}" >> "${GITHUB_OUTPUT}"
          echo "install=${install}" >> "${GITHUB_OUTPUT}"

  pack:
    name: pack ${{ matrix.app }}
    needs: [build-packer, changes]
    if: needs.changes.outputs.pack != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.pack) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          persist-credentials: false
      - uses: ./catalog/.github/actions/use-packer
        with:
          sha256: ${{ needs.build-packer.outputs.packer-sha256 }}
      - name: Validate manifest
        env:
          APP: ${{ matrix.app }}
        run: pnpm validate "${APP}"
      # pack-app runs appflare-pack verify --hashes-only --max-modules.
      - name: Pack (unsigned), verify hashes and the module limit
        env:
          APP: ${{ matrix.app }}
        run: pnpm pack-app "${APP}" --out "dist/${APP}"
      # Only the install check needs the artifact; a sandbox entry's pack is the whole check.
      - name: Upload artifact
        if: contains(fromJSON(needs.changes.outputs.install), matrix.app)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-${{ matrix.app }}
          path: catalog/dist/${{ matrix.app }}
          if-no-files-found: error
          retention-days: 7

  install:
    name: install check ${{ matrix.app }}
    needs: [build-packer, changes, pack]
    # Fork pull requests get no secrets; there is nothing to install with.
    if: >-
      needs.changes.outputs.install != '[]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Deploys only the packed artifact (prebuilt modules and assets); never the
    # app's own build scripts.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.install) }}
    # One install per Worker name at a time, never cancelled: a superseded
    # run's cleanup finishes before the next run deploys under the same name.
    concurrency:
      group: ci-install-${{ matrix.app }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      APP: ${{ matrix.app }}
    steps:
      - name: Pick the CI Worker name
        working-directory: .
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # ci-<slug>-pr<number>; a dispatched run (a bump branch) uses a short
          # hash of its branch, so reruns reuse and clean up the same name.
          if [ -n "${PR_NUMBER}" ]; then
            suffix="pr${PR_NUMBER}"
          else
            suffix="b$(printf '%s' "${GITHUB_REF}" | sha256sum | cut -c1-8)"
          fi
          echo "SUFFIX=${suffix}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          persist-credentials: false
      - uses: ./catalog/.github/actions/use-packer
        with:
          sha256: ${{ needs.build-packer.outputs.packer-sha256 }}
      - name: Download the packed artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # One named artifact: its files land directly in this directory.
          name: artifact-${{ matrix.app }}
          path: catalog/dist/${{ matrix.app }}
      - name: Deploy to the CI account and health-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci-install.ts deploy "dist/${APP}" --suffix "${SUFFIX}"
      - name: Delete the CI Worker and its resources
        if: always() && steps.download.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci-install.ts cleanup "dist/${APP}" --suffix "${SUFFIX}"

  # The one check of this workflow a branch ruleset can require. The pack and
  # install jobs are named per app, and GitHub auto-merge waits only for
  # required checks, which need fixed names. Passes only when every job above
  # succeeded; pack may be skipped only when no artifact or sandbox tier app
  # changed, and install only when no artifact tier app changed.
  verify-passed:
    name: verify passed
    needs: [build-packer, check, changes, pack, install]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every verify job to have succeeded
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
          PACK_APPS: ${{ needs.changes.outputs.pack }}
          INSTALL_APPS: ${{ needs.changes.outputs.install }}
        run: |
          set -euo pipefail
          # The jobs in `needs` above; each must be evaluated exactly once.
          expected="build-packer changes check install pack"
          # A plain assignment, so a jq failure stops the step (set -e).
          results="$(jq -r 'to_entries | sort_by(.key)[] | "\(.key) \(.value.result)"' <<< "${RESULTS}")"
          status=0
          seen=""
          while read -r job result; do
            [ -n "${job}" ] || continue
            seen="${seen:+${seen} }${job}"
            allowed="success"
            # Each list is empty only when the changes job succeeded and found no such app.
            if { [ "${job}" = "pack" ] && [ "${PACK_APPS}" = "[]" ]; } ||
               { [ "${job}" = "install" ] && [ "${INSTALL_APPS}" = "[]" ]; }; then
              allowed="success skipped"
            fi
            if [[ " ${allowed} " == *" ${result} "* ]]; then
              echo "${job}: ${result}"
            else
              echo "::error::${job}: ${result}"
              status=1
            fi
          done <<< "${results}"
          if [ "${seen}" != "${expected}" ]; then
            echo "::error::evaluated jobs [${seen}], expected [${expected}]"
            status=1
          fi
          exit "${status}"
