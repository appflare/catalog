name: conventions

# Every push to main and every pull request: each new commit message is a
# Conventional Commit (commitlint.config.mjs). Needs no secrets and no appflare
# checkout, so it also runs for fork pull requests.

on:
  pull_request:
  push:
    branches: [main]
  # The bump workflow's pull requests get pull_request runs that wait for a
  # maintainer's approval, so it starts this on each bump branch; the branch is
  # linted against main, and the report job sets the result as a commit status.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # commitlint needs no build step, so no dependency install script runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint every commit in the push or pull request
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            BASE="$(git merge-base origin/main "${HEAD_SHA}")"
          fi
          if [[ -n "${BASE}" && ! "${BASE}" =~ ^0+$ ]] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "${BASE}" --to "${HEAD_SHA}" --verbose
          else
            # A new branch or rewritten history: the old tip is gone, so lint
            # every commit reachable from HEAD, root commits included.
            for root in $(git rev-list --max-parents=0 "${HEAD_SHA}"); do
              git log -1 --format=%B "${root}" | pnpm exec commitlint --verbose
              pnpm exec commitlint --from "${root}" --to "${HEAD_SHA}" --verbose
            done
          fi

  # A pull request's checks and its branch rules ignore the check runs of a
  # workflow_dispatch run (the bump workflow's runs), so a dispatched run also
  # sets its result as a commit status named "commit messages" on the commit it
  # linted. A separate job, so the job that installs and runs commitlint never
  # holds a token that can write statuses. A cancelled run sets none: the run
  # that replaced it does.
  report:
    name: report commit messages
    needs: commits
    if: github.event_name == 'workflow_dispatch' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set the result as a commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.commits.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${RESULT}" = "success" ]; then
            state=success description="Every commit message follows the conventions"
          else
            state=failure description="A commit message does not follow the conventions"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" -f context="commit messages" \
            -f description="${description}" -f target_url="${RUN_URL}" > /dev/null
          echo "set commit messages: ${state} on ${GITHUB_SHA}"
