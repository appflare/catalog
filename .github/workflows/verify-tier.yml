name: verify tier

# Manual: record lastVerified for a sandbox or self-deploying tier entry,
# which neither verify.yml nor nightly.yml installs. Both run in the sandbox
# Worker (appflare-sandbox) of the installing account, on Workers Paid: it
# builds a sandbox tier entry, and runs a self-deploying entry's own installer
# with a token the admin creates for the app. Only a manager can ask it to,
# so CI cannot install either by itself. A maintainer does that part by hand,
# then runs this workflow:
#
#   1. In a Workers Paid account kept for this purpose, enable sandbox builds
#      (npx @appflare/cli sandbox enable) and install the entry's current
#      version (the one index.json lists) with the Appflare manager there.
#   2. Actions > verify tier > Run workflow, with the slug, that version, and
#      the Worker name it was installed under when it is not the manifest's
#      install.workerName. A self-deploying entry always needs it: its
#      installer names the Worker after the install's stage.
#   3. Uninstall it again in the manager.
#
#   build-packer  APPFLARE_DEPLOY_KEY only; builds the packer bundle
#   check         PAID_CLOUDFLARE_API_TOKEN and PAID_CLOUDFLARE_ACCOUNT_ID only;
#                 runs no app code. Fails, recording nothing, unless index.json
#                 lists that version, the account has the appflare-sandbox
#                 Worker, and the app's Worker passes the health check
#   record        CATALOG_PUSH_KEY; patches lastVerified into index.json
#                 (record-verified: same slug, version, and manifestDigest)
#   pages         deploys the updated site
#
# The check cannot tell which commit the running Worker was built from; the
# maintainer's install through the manager is what vouches for that.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: The app's slug, for example "flaremo".
        type: string
        required: true
      version:
        description: The version installed, exactly as index.json lists it.
        type: string
        required: true
      worker:
        description: The Worker name it was installed under. Empty means the manifest's install.workerName; required for a self-deploying entry.
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: verify-tier
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: catalog

jobs:
  build-packer:
    name: build packer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      packer-sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      # main, like the check and record jobs, so the packer and schema come from
      # the .appflare-ref those jobs read, whatever ref the run was started on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          ref: main
          persist-credentials: false
      - id: build
        uses: ./catalog/.github/actions/build-packer
        with:
          appflare-deploy-key: ${{ secrets.APPFLARE_DEPLOY_KEY }}

  check:
    name: check ${{ inputs.slug }}@${{ inputs.version }}
    needs: build-packer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require the paid account's credentials
        working-directory: .
        env:
          PAID_CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
          PAID_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PAID_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${PAID_CLOUDFLARE_API_TOKEN}" ] || [ -z "${PAID_CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=No paid account configured::Set PAID_CLOUDFLARE_API_TOKEN (Workers Scripts read) and PAID_CLOUDFLARE_ACCOUNT_ID for the Workers Paid account that has sandbox builds enabled and the app installed, then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          ref: main
          persist-credentials: false
      - uses: ./catalog/.github/actions/use-packer
        with:
          sha256: ${{ needs.build-packer.outputs.packer-sha256 }}
      - name: Check the account, the listed version, and the app's health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PAID_CLOUDFLARE_ACCOUNT_ID }}
          SLUG: ${{ inputs.slug }}
          VERSION: ${{ inputs.version }}
          WORKER: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          worker=()
          if [ -n "${WORKER}" ]; then
            worker=(--worker "${WORKER}")
          fi
          mkdir -p "${RUNNER_TEMP}/verified"
          pnpm -s verify-tier "${SLUG}" --version "${VERSION}" "${worker[@]}" \
            --out "${RUNNER_TEMP}/verified/verified.json"
          echo "${SLUG}@${VERSION} passed the manual install check" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified
          path: ${{ runner.temp }}/verified/verified.json
          if-no-files-found: error
          retention-days: 7

  record:
    name: record the check
    needs: [build-packer, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The index.json push uses CATALOG_PUSH_KEY, not this token.
      contents: read
    steps:
      # Pushed over SSH with CATALOG_PUSH_KEY, as in nightly.yml: main's ruleset
      # rejects a push with the workflow token. This job runs no app code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          ref: main
          ssh-key: ${{ secrets.CATALOG_PUSH_KEY }}
          persist-credentials: true
      - name: Download the passing check
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified
          path: ${{ runner.temp }}/verified
      - uses: ./catalog/.github/actions/use-packer
        with:
          sha256: ${{ needs.build-packer.outputs.packer-sha256 }}
      - name: Rebuild and commit index.json
        uses: ./catalog/.github/actions/commit-index
        with:
          github-token: ${{ github.token }}
          message: "chore: record the ${{ inputs.slug }} install check in index.json [skip ci]"
          verified-file: ${{ runner.temp }}/verified/verified.json
      - name: Assemble the Pages site
        run: pnpm -s build-site --out site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: catalog/site

  pages:
    name: deploy Pages
    needs: record
    if: ${{ !cancelled() && needs.record.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
