name: min-stars

# Pull requests that add an app: every new app's upstream repository
# (upstreamRepo, else repo) needs at least MIN_STARS GitHub stars
# (scripts/lib/min-stars.ts). A pull request that adds one under the bar gets
# a comment naming it and is closed; reopening it runs the check again.
#
# Runs on pull_request_target so fork pull requests get a token that can
# comment and close. It checks out the base branch only and runs no code from
# the pull request: scripts/check-stars.ts lists the pull request's files and
# reads each new manifest through the API, as data. Entries already listed and
# their bumps add no manifest, so the check passes for them at once.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: min-stars-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stars:
    name: minimum stars
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base branch (pull_request_target's default), never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: check
        name: Count the stars of each new app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/check-stars.ts --pr "${PR_NUMBER}" --head "${HEAD_SHA}" \
            --comment "${RUNNER_TEMP}/min-stars.md" >> "${GITHUB_OUTPUT}"
      - name: Comment and close
        if: steps.check.outputs.rejected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/min-stars.md"
          gh pr close "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}"
          echo "::error::A new app has fewer stars than the catalog requires; the pull request is closed."
          exit 1
