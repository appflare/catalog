name: stats

# About hourly: rebuild stats.json (GitHub stars of each entry's upstream
# repository, and install counts from the anonymous events Appflare managers
# send to PostHog) and redeploy the Pages site with it. Nothing is committed.
#
#   stats   environment "stats" (POSTHOG_PERSONAL_API_KEY, read-only); checks
#           out the catalog only for its scripts and manifests, runs no app
#           code and needs no appflare checkout
#   pages   takes the last site publish or nightly built from main (their
#           "catalog-site" artifact), replaces only its stats.json, and
#           deploys it
#
# This workflow never rebuilds index.json or any other file of the site, so it
# cannot publish an older index over a newer one: the site it deploys is the
# newest one built from main, with new popularity numbers. publish and
# nightly, in turn, copy the live stats.json into every site they build, so
# they never remove the numbers. All three deploy in the "pages" concurrency
# group, one deploy at a time.
#
# Scheduled at minute 23, away from the top of the hour when GitHub's
# scheduler is busiest; runs can still be late or skipped under load, which
# the manager tolerates (it hides numbers older than 72 hours).

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: stats
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: catalog

jobs:
  stats:
    name: build stats.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: stats
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          ref: main
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: catalog/package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: catalog/.node-version
      - name: Install catalog dependencies
        run: pnpm install --frozen-lockfile
      # A source that fails keeps its previous numbers (from the live
      # stats.json) and is marked ok: false; the step fails only when no
      # valid file can be written.
      - name: Build stats.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
        run: pnpm -s build-stats --out "${RUNNER_TEMP}/stats.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stats
          path: ${{ runner.temp }}/stats.json
          if-no-files-found: error
          retention-days: 1

  pages:
    name: deploy Pages with the new stats
    needs: stats
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # gh api and gh run download of the last catalog-site artifact.
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Shared with the Pages jobs of publish and nightly: one deploy at a time.
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download the stats
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stats
          path: ${{ runner.temp }}/stats
      # Looked up inside this job, after the concurrency group admitted it, so
      # a site publish or nightly deployed in the meantime is the one reused.
      - name: Download the newest site built from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=catalog-site&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .workflow_run.id // empty')"
          if [ -z "${run_id}" ]; then
            echo "::error title=No site to update::No catalog-site artifact from main exists yet. Run the publish workflow once; later runs of this workflow reuse its site."
            exit 1
          fi
          echo "reusing the site built by run ${run_id}"
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name catalog-site --dir site
          if [ ! -f site/index.json ]; then
            echo "::error::the catalog-site artifact of run ${run_id} has no index.json"
            exit 1
          fi
          cp "${RUNNER_TEMP}/stats/stats.json" site/stats.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
